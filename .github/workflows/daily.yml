name: Daily price collection

on:
  schedule:
    - cron: "17 4 * * *"   # every day 04:17 UTC = 09:17 Shymkent
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scraper.py

      - name: Commit new prices
        run: |
          git config user.name "price-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv
          git diff --cached --quiet || git commit -m "prices $(date -u +%F)"
          git push
